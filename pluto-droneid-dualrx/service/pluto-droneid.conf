# Pluto DroneID background tasks.
# One task per line: task-name|autostart|executable|arguments
# Keep fields separated by '|', and use whitespace-separated arguments.
# The manager does not evaluate this file as shell code.

scan|yes|/usr/bin/pluto-droneid-scan|--gain-db 30 --save-triggers /boot/droneid-captures
# Available on demand; never start transmitting automatically at boot.
tx|no|/usr/bin/dji-droneid-tx|--hops 2444500000 --gain 0
